<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>16 Week Six Pack Tracker</title>
<style>
:root{--bg:#0e0e0e;--card:#181818;--line:#2a2a2a;--text:#f2f2f2;--mute:#9a9a9a;--accent:#f4b928;--good:#4cc16f;--bad:#e5534b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 6px;max-width:900px;margin:0 auto}
h1{margin:0;font-size:20px;letter-spacing:.5px}
h1 span{color:var(--accent)}
nav{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav div{max-width:900px;margin:0 auto;display:flex;overflow-x:auto}
nav button{flex:1;min-width:84px;background:none;border:0;color:var(--mute);padding:12px 8px;font-size:15px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:900px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px;color:var(--accent)}
.card h3{margin:14px 0 6px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:120px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;background:#0f0f0f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
textarea{min-height:70px;resize:vertical}
button.btn{background:var(--accent);color:#111;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px}
button.btn.alt{background:#2a2a2a;color:var(--text)}
button.btn.danger{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px}
.bar{height:12px;background:#262626;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bar i.over{background:var(--bad)}
.mac{margin-bottom:10px}
.mac .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.mac .t b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--accent);color:#111;text-align:left;padding:8px}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.check{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.pill{display:inline-block;background:#262626;border-radius:20px;padding:3px 10px;font-size:13px;color:var(--mute);margin-right:6px}
.pill.y{background:var(--accent);color:#111;font-weight:700}
.mute{color:var(--mute);font-size:14px}
.tip{border-left:4px solid var(--accent);padding:8px 12px;background:#1f1b0e;border-radius:6px;margin:10px 0;font-size:14px}
.food{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.food:last-child{border-bottom:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#0f0f0f;border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
canvas{width:100%;height:240px;display:block}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg button{flex:1;min-width:70px;background:#262626;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#111;border-color:var(--accent)}
.vid{display:inline-block;background:#e5534b;color:#fff;text-decoration:none;font-size:10px;line-height:1;padding:4px 7px;border-radius:5px;vertical-align:middle;margin-left:4px}
.vid:hover{background:#ff6b62}
.shop{text-decoration:none;font-size:15px;margin-left:4px;vertical-align:middle}
.shop:hover{filter:brightness(1.4)}
.sl label{color:var(--text);font-size:15px;margin:0;flex:1;cursor:pointer}
.sl input:checked+label{text-decoration:line-through;color:var(--mute)}
.sl input:checked+label b{color:var(--mute)}
details{margin:10px 0}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
details[open] summary{margin-bottom:8px}
ol.steps{padding-left:20px;margin:0}
ol.steps li{margin-bottom:8px;font-size:14px;color:var(--mute)}
.last{font-size:12px;color:var(--mute);margin-top:3px}
footer{max-width:900px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:12px}
</style>
</head>
<body>
<header><h1>16 WEEK <span>SIX PACK</span> TRACKER</h1></header>
<nav><div id="nav"></div></nav>
<main id="view"></main>
<footer>Based on the 16 Week Six Pack Blueprint by Team Conditioned. All data is saved only in this browser. General fitness information, not medical advice.</footer>
<script>
const KEY='sixpack-tracker-v1';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=ds(new Date());
const SHOPQ={'Caffeine':'Caffeine powder'};
const shop=n=>`<a class="shop" href="https://www.google.com/search?tbm=shop&q=${encodeURIComponent(SHOPQ[n]||n+' supplement')}" target="_blank" rel="noopener noreferrer" title="Shop for ${esc(n)}" aria-label="Shop for ${esc(n)}">&#128722;</a>`;

const PHASES=[
{label:'Weeks 1-4',kcal:2200,p:180,c:190,f:70,meals:[
['Whole eggs, oats, blueberries','3 eggs, 100g oats, 50g berries','Egg whites + 1 egg, cream of rice, banana/raspberries'],
['Grilled chicken, salad greens, olive oil, apple','150g chicken, 150g greens, 15g oil, 150g apple','Turkey/tofu, avocado/seeds, pear/orange'],
['Salmon, cooked quinoa, broccoli','150g salmon, 100g quinoa, 100g broccoli','Cod/lean beef, rice/couscous, spinach/green beans'],
['Whey protein, banana','30g whey, 120g banana','Plant protein, apple/berries'],
['Greek yogurt, mixed nuts','150g yogurt, 15g nuts','Cottage cheese, almond butter/seeds']]},
{label:'Weeks 5-8',kcal:2000,p:180,c:160,f:65,meals:[
['Whole eggs, oats, blueberries','2 eggs, 75g oats, 40g berries','Egg whites + 1 egg, cream of rice, banana/raspberries'],
['Turkey mince, salad greens, olive oil, apple','150g turkey, 150g greens, 10g oil, 150g apple','Chicken/tofu, avocado/seeds, pear/orange'],
['Cod, cooked quinoa, broccoli','150g cod, 75g quinoa, 100g broccoli','Lean beef/salmon, rice/couscous, spinach/green beans'],
['Whey protein, small banana','30g whey, 100g banana','Plant protein, apple/berries'],
['Greek yogurt, almond butter','125g yogurt, 10g almond butter','Cottage cheese, seeds/nuts']]},
{label:'Weeks 9-12',kcal:1850,p:180,c:140,f:60,meals:[
['Egg whites, oats, strawberries','200ml whites, 50g oats, 30g berries','1 egg + whites, cream of rice, blueberries'],
['Turkey breast, spinach salad, olive oil, small fruit','150g turkey, 150g greens, 10g oil, 100g fruit','Chicken/tofu, avocado/seeds, pear/orange'],
['White fish, cooked rice, green beans','150g fish, 75g rice, 100g beans','Cod/lean beef, sweet potato/quinoa, broccoli'],
['Whey protein, berries','30g whey, 50g berries','Plant protein, apple/banana'],
['Greek yogurt, walnuts','100g yogurt, 10g nuts','Cottage cheese, almond butter/seeds']]},
{label:'Weeks 13-16',kcal:1700,p:180,c:120,f:52,meals:[
['Egg whites, green veggies, chia seeds','250ml egg whites, 100g greens, 5g seeds','1 egg + whites, spinach/kale, flaxseed'],
['Chicken breast, zucchini, olive oil','150g chicken, 100g zucchini, 10g oil','Turkey/tofu, avocado, mixed veg'],
['White fish, cauliflower rice, broccoli','150g fish, 75g cauli rice, 100g broccoli','Cod/lean beef, spinach/beans'],
['Whey protein isolate, cucumber slices','30g whey, 100g cucumber','Plant isolate, celery/carrot sticks'],
['Low-fat Greek yogurt, almonds','100g yogurt, 10g almonds','Cottage cheese, sunflower seeds/nut butter']]}
];

const EX={
'Barbell Back Squat':[2,'6-8 / 10-12','Control eccentric, drive up through heels'],
'Incline Smith Chest Press':[2,'6-8 / 10-12','Full ROM, control eccentric'],
'Bent Over DB Row':[2,'6-8 / 10-12','Stretch and contract each rep'],
'Romanian Deadlift':[1,'6-8','Hamstring and glute focussed'],
'Single Arm Cable Lateral Raise':[2,'15-20','Slightly lean over, lead with elbow'],
'Cable EZ Bicep Curl':[2,'10-12 / 12-15','Elbow kept in place, no swinging'],
'Walking Lunge':['2/leg','12-15 steps','DB or BB option here'],
'Machine Flat Chest Press':[2,'10-12','Avoid full lock out to keep tension'],
'Seated Cable Row':[2,'12-15','Hold in the contracted position'],
'Hamstring Curl Machine':[1,'15-20','Think heel to glute here'],
'DB Lateral Raise':[2,'15-20','Slow 3 second eccentric here'],
'Rope Cable Crunch':[2,'20+','Kneeling, contract abs hard and breathe out'],
'Leg Press':[2,'6-8 / 10-12','Control eccentric, drive up through heels'],
'Incline DB Press':[2,'6-8 / 10-12','Control eccentric, full ROM'],
'Barbell Row':[2,'6-8 / 10-12','Focus on staying bent over and not using leg drive'],
'Quad Extension':[2,'10-15','Use handles to pull into the machine, drag each rep'],
'Chest Supported DB Side Raise':[2,'15-20','Lean into fully incline bench to remove momentum'],
'Incline DB Curl':[2,'10-12 / 12-15','Sitting back into a incline bench'],
'Incline Barbell Press':[2,'6-8 / 10-12','Control eccentric, full ROM'],
'Straight Bar Lat Pulldown':[2,'6-8 / 10-12','Elbows into armpits, control eccentric'],
'DB Shoulder Press':[2,'6-8 / 10-12','Have the bench 1 notch lower than fully incline'],
'Rope Tricep Pushdown':[2,'10-12 / 12-15','Elbow kept in place'],
'Machine Calf Raise':[2,'10-15','Full ROM spending time in both top and bottom positions'],
'Single Arm Cable Row':[2,'6-8 / 10-12','Elbow into hip'],
'High Incline Smith Press':[2,'6-8 / 10-12','Have the bench 2 notches lower than fully incline'],
'Dips':[2,'10-12 / 12-15','Assisted or weighted or bodyweight'],
'Standing DB Side Raise':[2,'15-20','Slightly lean over, lead with elbow'],
'Seated Alternating DB Curl':[2,'10-12 / 12-15','Elbow kept in place, no swinging'],
'Single Leg Quad Extension':[2,'10-15','Use handles to pull into the machine, drag each rep'],
'Barbell Deadlift':[1,'6-8','Ensure keeping a straight lower back, driving hips through'],
'Smith Bulgarian Split Squat':['2/leg','12-15 steps','Focus on a full ROM and slow eccentric'],
'Toe Press on Leg Press':[2,'10-15','Full ROM spending time in both top and bottom positions'],
'Single Leg Hamstring Curl Machine':[1,'15-20','Think heel to glute here'],
'Reverse Pec Dec Flye':[2,'12-15','Do not let elbows go further back than shoulder line'],
'Machine Bicep Preacher Curl':[1,'15-20','Ensuring a hard contraction at the top'],
'Neutral Grip Shoulder Width Cable Row':[2,'6-8 / 10-12','Elbows into armpits, control eccentric']
};
const SPLITS={
3:[['Day 1 - Full Body A',['Barbell Back Squat','Incline Smith Chest Press','Bent Over DB Row','Romanian Deadlift','Single Arm Cable Lateral Raise','Cable EZ Bicep Curl']],
['Day 2 - Full Body B',['Walking Lunge','Machine Flat Chest Press','Seated Cable Row','Hamstring Curl Machine','DB Lateral Raise','Rope Cable Crunch']],
['Day 3 - Full Body C',['Leg Press','Incline DB Press','Barbell Row','Quad Extension','Chest Supported DB Side Raise','Incline DB Curl']]],
4:[['Day 1 - Upper A',['Incline Barbell Press','Straight Bar Lat Pulldown','DB Shoulder Press','Rope Tricep Pushdown','Single Arm Cable Lateral Raise','Cable EZ Bicep Curl']],
['Day 2 - Lower A',['Quad Extension','Barbell Back Squat','Romanian Deadlift','Walking Lunge','Machine Calf Raise','Hamstring Curl Machine']],
['Day 3 - Upper B',['Incline DB Press','Single Arm Cable Row','High Incline Smith Press','Dips','Standing DB Side Raise','Seated Alternating DB Curl']],
['Day 4 - Lower B',['Single Leg Quad Extension','Leg Press','Barbell Deadlift','Smith Bulgarian Split Squat','Toe Press on Leg Press','Single Leg Hamstring Curl Machine']]],
5:[['Day 1 - Push (Chest, Shoulders, Triceps)',['Incline DB Press','DB Shoulder Press','High Incline Smith Press','Dips','Standing DB Side Raise','Rope Tricep Pushdown']],
['Day 2 - Pull (Back, Rear Delts, Biceps)',['Straight Bar Lat Pulldown','Barbell Row','Single Arm Cable Row','Reverse Pec Dec Flye','Seated Alternating DB Curl','Machine Bicep Preacher Curl']],
['Day 3 - Legs (Quads, Hamstrings, Glutes, Calves)',['Quad Extension','Barbell Back Squat','Romanian Deadlift','Walking Lunge','Machine Calf Raise','Hamstring Curl Machine']],
['Day 4 - Upper (Chest, Back, Shoulders, Arms)',['Incline Barbell Press','Neutral Grip Shoulder Width Cable Row','DB Shoulder Press','Rope Tricep Pushdown','Single Arm Cable Lateral Raise','Cable EZ Bicep Curl']],
['Day 5 - Legs (Quads, Hamstrings, Glutes, Calves)',['Single Leg Quad Extension','Leg Press','Barbell Deadlift','Smith Bulgarian Split Squat','Toe Press on Leg Press','Single Leg Hamstring Curl Machine']]]
};
const SUPPS=[
['Creatine monohydrate','5 g daily','Improved strength, muscular fullness, power output, recovery','Performance'],
['Caffeine','100-200 mg pre workout','Boosts focus, alertness, strength, and fat burning','Performance'],
['Beta-alanine','3.2 g daily','Buffers lactic acid, delays muscle fatigue, enhances endurance','Performance'],
['Omega 3 (EPA/DHA)','4 g daily','Reduced inflammation, joint health, heart health, brain function','Health'],
['Vitamin D3','4000 IU daily','Boosts immune system, hormone health, mood and muscular function','Health'],
['Magnesium glycinate','400 mg daily','Improved sleep, recovery, stress management, electrolyte balance','Health'],
['Probiotic','Daily (multi-strain)','Enhances digestion, gut health and immune function','Health']
];
const SUPP_WARN='Supplements are optional. Check with your doctor first, especially if you take medication or have a health condition.';

function defaults(){return{settings:{start:TODAY,weight:'',split:4,meals:3,units:'g',setup:false},days:{},lifts:{}}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.settings)return{settings:Object.assign(defaults().settings,r.settings),days:r.days||{},lifts:r.lifts||{}}}catch(e){}return defaults()}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function day(d){if(!S.days[d])S.days[d]={weight:'',steps:'',food:[],supps:{},workout:false,photo:false,notes:'',sleep:'',energy:'',recov:'',alc:'',sug:''};return S.days[d]}

let tab=S.settings.setup?'today':'setup';
let cur=TODAY;
let trainDay=null;
const TABS=[['today','Today'],['meals','Meals'],['train','Training'],['progress','Progress'],['guide','Guide'],['setup','Setup']];
function nextWorkoutIdx(){const n=SPLITS[S.settings.split].length;return Object.keys(S.days).filter(k=>S.days[k].workout).length%n}
let RF=[];
function recentFoods(){
const seen={},out=[];
Object.keys(S.days).sort().reverse().forEach(k=>{S.days[k].food.slice().reverse().forEach(x=>{
const n=(x.n||'').trim();
if(!n||seen[n.toLowerCase()]||out.length>=8)return;
seen[n.toLowerCase()]=1;out.push(x);
})});
return out;
}

function weekNum(d){return Math.floor((pd(d)-pd(S.settings.start))/86400000/7)+1}
function phaseFor(d){const w=weekNum(d);const i=Math.min(3,Math.max(0,Math.floor((Math.min(16,Math.max(1,w))-1)/4)));return PHASES[i]}
function conv(s){
if(S.settings.units!=='oz')return s;
return s.replace(/(\d+(?:\.\d+)?)\s?ml/g,(m,n)=>(n/29.57).toFixed(1)+' fl oz').replace(/(\d+(?:\.\d+)?)\s?g\b/g,(m,n)=>(n/28.35).toFixed(1)+' oz');
}
function fmtDate(d){return pd(d).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'})}

function renderNav(){
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}" class="${tab===t[0]?'on':''}">${t[1]}</button>`).join('');
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();window.scrollTo(0,0)});
}

function macroBar(label,val,target,unit){
const pct=Math.min(100,target?val/target*100:0);
const over=val>target;
return`<div class="mac"><div class="t"><span>${label}</span><span><b>${Math.round(val)}</b> / ${target}${unit}</span></div><div class="bar"><i class="${over?'over':''}" style="width:${pct}%"></i></div></div>`;
}

function totals(d){const f=day(d).food;return f.reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0})}

function viewToday(){
const d=day(cur),ph=phaseFor(cur),w=weekNum(cur),t=totals(cur);
RF=recentFoods();
const sp=SPLITS[S.settings.split],ni=nextWorkoutIdx();
const backupDue=Object.keys(S.days).length>=3&&(!S.settings.lastBackup||(pd(TODAY)-pd(S.settings.lastBackup))/86400000>14);
const wl=w<1?'Starts in '+(1-w)+' wk':w>16?'Blueprint complete':'Week '+w+' of 16';
const stepPct=Math.min(100,(Number(d.steps)||0)/10000*100);
return`
<div class="card">
<div class="row"><button class="btn alt sm" id="prev">&lt;</button><input type="date" id="dt" value="${cur}" class="grow"><button class="btn alt sm" id="next">&gt;</button><button class="btn sm" id="tod">Today</button></div>
<p style="margin:10px 0 0"><span class="pill y">${wl}</span><span class="pill">${ph.label} targets</span></p>
</div>
<div class="card"><h2>Your Plan Today</h2>
<div class="check"><div class="grow"><b>Workout:</b> ${d.workout?'Done today. Next up: ':''}${esc(sp[ni][0])}</div><button class="btn sm" id="gotrain">Open</button></div>
<div class="check"><div class="grow"><b>Food:</b> ${ph.kcal} kcal, ${ph.p}g protein, ${ph.c}g carbs, ${ph.f}g fat</div><button class="btn alt sm" id="gomeals">Meals</button></div>
<div class="check"><div class="grow"><b>Steps:</b> 10,000</div></div>
<div class="check"><div class="grow"><b>Sleep:</b> 7-9 hours</div></div>
<details><summary>Show today's meals</summary>${ph.meals.slice(0,S.settings.meals).map((m,i)=>`<p class="mute" style="margin:6px 0"><b>${i+1}.</b> ${m[0]}<br>${conv(m[1])}</p>`).join('')}</details>
${backupDue?'<div class="tip"><b>Back up your data.</b> It is saved only in this browser. Go to Progress and tap Export backup.</div>':''}
</div>
<div class="card"><h2>Daily Targets</h2>
${macroBar('Calories',t.k,ph.kcal,'')}${macroBar('Protein',t.p,ph.p,'g')}${macroBar('Carbs',t.c,ph.c,'g')}${macroBar('Fat',t.f,ph.f,'g')}
</div>
<div class="card"><h2>Log Food</h2>
<div class="row"><div class="grow" style="flex:2;min-width:160px"><label>Food</label><input id="fn" placeholder="e.g. Chicken and rice"></div>
<div class="grow"><label>Calories (auto if blank)</label><input id="fk" type="number" inputmode="decimal" min="0"></div>
<div class="grow"><label>Protein g</label><input id="fp" type="number" inputmode="decimal" min="0"></div>
<div class="grow"><label>Carbs g</label><input id="fc" type="number" inputmode="decimal" min="0"></div>
<div class="grow"><label>Fat g</label><input id="ff" type="number" inputmode="decimal" min="0"></div>
<button class="btn" id="fadd">Add</button></div>
${RF.length?`<p class="mute" style="margin:10px 0 4px">Tap to add again:</p><div class="seg" style="margin-bottom:0">${RF.map((x,i)=>`<button data-rf="${i}" style="flex:none">${esc(x.n)}</button>`).join('')}</div>`:''}
<div style="margin-top:10px">${d.food.length?d.food.map((x,i)=>`<div class="food"><span>${esc(x.n||'Food')}<br><span class="mute">${Math.round(x.k)} kcal | P ${Math.round(x.p)} | C ${Math.round(x.c)} | F ${Math.round(x.f)}</span></span><button class="btn danger sm" data-del="${i}">Remove</button></div>`).join(''):'<p class="mute">Nothing logged yet.</p>'}</div>
</div>
<div class="card"><h2>Daily Check-in</h2>
<div class="row"><div class="grow"><label>Morning weight (lb, fasted)</label><input id="wt" type="number" inputmode="decimal" step="0.1" value="${esc(d.weight)}"></div>
<div class="grow"><label>Steps (goal 10,000)</label><input id="st" type="number" inputmode="numeric" value="${esc(d.steps)}"></div></div>
<div class="bar" style="margin:10px 0"><i style="width:${stepPct}%"></i></div>
<div class="check"><input type="checkbox" id="wk" ${d.workout?'checked':''}><label style="margin:0;color:var(--text)">Workout completed</label></div>
<div class="check"><input type="checkbox" id="ph" ${d.photo?'checked':''}><label style="margin:0;color:var(--text)">Progress photo taken (weekly or bi-weekly, same lighting)</label></div>
</div>
<div class="card"><h2>Supplements</h2>
${SUPPS.map((s,i)=>`<div class="check"><input type="checkbox" data-sp="${i}" ${d.supps[i]?'checked':''}><label style="margin:0;color:var(--text)">${s[0]} <span class="mute">${s[1]}</span></label>${shop(s[0])}</div>`).join('')}
<p class="mute" style="margin-bottom:0">${SUPP_WARN}</p>
</div>
<div class="card"><h2>Sleep and Recovery</h2>
<div class="row">
<div class="grow"><label>Hours slept last night</label><input id="slp" type="number" inputmode="decimal" step="0.1" min="0" max="24" value="${esc(d.sleep||'')}"></div>
<div class="grow"><label>Energy (1 low, 5 high)</label><select id="en"><option value="">-</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${String(d.energy)===String(n)?'selected':''}>${n}</option>`).join('')}</select></div>
<div class="grow"><label>Recovery (1 sore and drained, 5 fresh)</label><select id="rc"><option value="">-</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${String(d.recov)===String(n)?'selected':''}>${n}</option>`).join('')}</select></div>
</div>
<div class="row" style="margin-top:10px">
<div class="grow"><label>Alcoholic drinks today</label><input id="al" type="number" inputmode="numeric" min="0" value="${esc(d.alc||'')}"></div>

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fmtG=g=>g>=1000?+(g/1000).toFixed(2)+' kg':Math.round(g)+' g';
const fmtOz=o=>{
if(o>=16){let lb=Math.floor(o/16);let r=Math.round(o-lb*16);if(r===16){lb++;r=0}return lb+' lb'+(r?' '+r+' oz':'')}
return (+o.toFixed(1))+' oz';
};
const FIX={
'0:0:oats':'rolled oats','0:0:berries':'blueberries (fresh or frozen)','0:1:chicken':'chicken breast','0:1:greens':'salad greens (mixed lettuce, spinach)','0:1:oil':'olive oil','0:3:whey':'whey protein','0:3:banana':'bananas','0:4:yogurt':'Greek yogurt','0:4:nuts':'mixed nuts',
'1:0:oats':'rolled oats','1:0:berries':'blueberries (fresh or frozen)','1:1:turkey':'turkey mince','1:1:greens':'salad greens (mixed lettuce, spinach)','1:1:oil':'olive oil','1:3:whey':'whey protein','1:3:banana':'bananas','1:4:yogurt':'Greek yogurt',
'2:0:whites':'egg whites','2:0:oats':'rolled oats','2:0:berries':'strawberries (fresh or frozen)','2:1:turkey':'turkey breast','2:1:greens':'spinach','2:1:oil':'olive oil','2:2:fish':'white fish','2:2:rice':'rice (jasmine or basmati)','2:2:beans':'green beans','2:3:whey':'whey protein','2:3:berries':'berries (fresh or frozen)','2:4:yogurt':'Greek yogurt','2:4:nuts':'walnuts',
'3:0:greens':'spinach or kale','3:0:seeds':'chia seeds','3:1:chicken':'chicken breast','3:1:oil':'olive oil','3:2:fish':'white fish','3:2:cauli rice':'cauliflower rice','3:3:whey':'whey protein isolate','3:4:yogurt':'low-fat Greek yogurt'
};
function shoppingItems(sel,n,days){
const map={};
PHASES[sel].meals.slice(0,n).forEach((m,mi)=>{
m[1].split(',').forEach(part=>{
const t=part.trim();
let r=t.match(/^(\d+(?:\.\d+)?)\s?(g|ml)\s+(.+)$/);
let amt,unit,name;
if(r){amt=+r[1];unit=r[2];name=r[3]}
else{r=t.match(/^(\d+(?:\.\d+)?)\s+(.+)$/);if(!r)return;amt=+r[1];unit='ct';name=r[2]}
const disp=FIX[sel+':'+mi+':'+name.toLowerCase()]||name;
const key=disp.toLowerCase();
if(!map[key])map[key]={name:disp,g:0,ml:0,ct:0};
map[key][unit]+=amt*days;
});
});
return Object.values(map).sort((a,b)=>a.name.toLowerCase()<b.name.toLowerCase()?-1:1);
}
function fmtAmt(i){
const oz=S.settings.units==='oz';
const p=[];
if(i.g)p.push(oz?fmtOz(i.g/28.35):fmtG(i.g));
if(i.ml)p.push(oz?Math.round(i.ml/29.57)+' fl oz':(i.ml>=1000?+(i.ml/1000).toFixed(2)+' L':Math.round(i.ml)+' ml'));
if(i.ct)p.push(String(i.ct));
return p.join(' + ');
}

function drawChart(){
const cv=$('#cv');if(!cv)return;
const arr=weights();if(!arr.length)return;
const avg=movAvg(arr);
const dpr=window.devicePixelRatio||1;
const W=cv.clientWidth,H=cv.clientHeight;
cv.width=W*dpr;cv.height=H*dpr;
const g=cv.getContext('2d');g.scale(dpr,dpr);
const vals=arr.map(x=>x.w).concat(avg);
let lo=Math.min(...vals)-1,hi=Math.max(...vals)+1;
const L=40,R=10,T=10,B=24;
const t0=pd(arr[0].d).getTime(),t1=pd(arr[arr.length-1].d).getTime();
const X=d=>arr.length===1||t1===t0?L+(W-L-R)/2:L+(pd(d).getTime()-t0)/(t1-t0)*(W-L-R);
const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
g.strokeStyle='#2a2a2a';g.fillStyle='#9a9a9a';g.font='11px system-ui';g.lineWidth=1;
for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.fillText(v.toFixed(0),4,y+4)}
g.fillText(arr[0].d.slice(5),L,H-6);
const e=arr[arr.length-1].d.slice(5);g.fillText(e,W-R-g.measureText(e).width,H-6);
g.fillStyle='#6b6b6b';arr.forEach(x=>{g.beginPath();g.arc(X(x.d),Y(x.w),3,0,7);g.fill()});
g.strokeStyle='#f4b928';g.lineWidth=2.5;g.beginPath();
arr.forEach((x,i)=>{const px=X(x.d),py=Y(avg[i]);i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();
}
function bindProgress(){
drawChart();
const ex=$('#exp');if(!ex)return;
ex.onclick=()=>{S.settings.lastBackup=TODAY;save();const b=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='six-pack-tracker-'+TODAY+'.json';a.click()};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
const f=e.target.files[0];if(!f)return;
const r=new FileReader();
r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.settings||!o.days)throw 0;S={settings:Object.assign(defaults().settings,o.settings),days:o.days,lifts:o.lifts||{}};save();render()}catch(x){alert('That file is not a valid backup.')}};
r.readAsText(f);
};
$('#rst').onclick=()=>{if(confirm('Erase all saved data in this browser?')){S=defaults();save();tab='setup';render()}};
}

function viewGuide(){
return`
<div class="card"><h2>Nutrition Strategy</h2>
<p><b>Step 1 - Estimate maintenance calories:</b> multiply your bodyweight in pounds by 14-16.</p>
<p><b>Step 2 - Set your deficit:</b> begin with a 15-20% calorie reduction from maintenance.</p>
<p><b>Step 3 - Reassess every 4 weeks:</b> if weight stalls for 7+ days, reduce calories by 100-200 per day or add cardio.</p>
<div class="scroll"><table><tr><th>Macro</th><th>Target</th><th>Function</th></tr>
<tr><td>Protein</td><td>1.0-1.2 g per lb</td><td>Preserves muscle, supports recovery, increases satiety</td></tr>
<tr><td>Fats</td><td>0.3-0.4 g per lb</td><td>Hormone production, brain function, vitamin absorption</td></tr>
<tr><td>Carbs</td><td>Remainder of calories</td><td>Fuel training, prevent muscle loss, support performance and metabolism</td></tr></table></div>
</div>
<div class="card"><h2>Daily Step Target: 10,000</h2>
<p class="mute">Steps raise energy expenditure without adding training fatigue. They also help regulate blood sugar and insulin sensitivity, support digestion, improve recovery, and encourage routine movement and mental clarity.</p>
<p class="mute">If you start lower (5-7k), add 500-1000 steps every few days until you consistently hit 10k+.</p>
<div class="tip">Tips: walk 10 minutes after meals, walk while on the phone, park further away, take stairs instead of elevators, make a morning or evening walk part of your routine.</div>
</div>
<div class="card"><h2>Supplements</h2>
<div class="scroll"><table><tr><th>Supplement</th><th>Dosage</th><th>Benefits</th></tr>
${SUPPS.map(s=>`<tr><td><b>${s[0]}</b> ${shop(s[0])}</td><td>${s[1]}</td><td class="mute">${s[2]}</td></tr>`).join('')}</table></div>
<p class="mute">${SUPP_WARN}</p>
</div>
<div class="card"><h2>Sleep and Recovery</h2>
<p class="mute">This section goes beyond the original blueprint and is general guidance.</p>
<h3>Sleep target: 7-9 hours</h3>
<p class="mute">Aim for at least 7 hours every night. Short sleep while dieting increases hunger and cravings, makes it harder to hold onto muscle, and slows recovery between workouts.</p>
<div class="tip">Habits that help: same bedtime and wake time every day, a cool dark room (about 65-68 F), no caffeine after about 12:00 PM to 2:00 PM, screens off 30-60 minutes before bed, and your magnesium glycinate in the evening if you take it.</div>
<h3>What to log each day</h3>
<div class="scroll"><table><tr><th>Field</th><th>How to score it</th></tr>
<tr><td>Hours slept</td><td>Total sleep from your ring or phone. If you do not track it, estimate.</td></tr>
<tr><td>Energy (1-5)</td><td>1 = dragging all day, 3 = normal, 5 = great energy and focus</td></tr>
<tr><td>Recovery (1-5)</td><td>1 = very sore or drained, 3 = normal, 5 = fresh and ready to train hard</td></tr>
<tr><td>Notes</td><td>Anything unusual: poor sleep, stress, illness, travel, hunger, a missed meal</td></tr></table></div>
<h3>Using a smart ring</h3>
<p class="mute">A ring is useful for trends over weeks, not single nights. The numbers worth watching are sleep duration, bedtime consistency, resting heart rate and HRV. If resting heart rate is up and HRV is down for several days in a row, sleep more and consider an easier training day. Do not chase a perfect score.</p>
<h3>Should you cut soda, sugar and alcohol?</h3>
<p class="mute"><b>Soda and sugary drinks:</b> yes, cut them. They add calories without filling you up. Swap in water, sparkling water, black coffee, tea or zero calorie drinks. Juice and energy drinks count too.</p>
<p class="mute"><b>Added sugar and sweets:</b> you do not need to ban them, but they use up calories fast and hurt your protein and fiber targets. Keep them small and log them if you eat them.</p>
<p class="mute"><b>Alcohol:</b> the best choice for the 16 weeks is none. It adds calories (a beer is roughly 150 calories, and many cocktails are more), disrupts sleep, slows recovery and makes it easier to overeat. If you do drink, keep it occasional, 1-2 drinks, and log the calories in the food log.</p>
<p class="mute">General fitness guidance, not medical advice. Talk to your doctor if you have a health condition or take medication.</p>
</div>
<div class="card"><h2>Cardio</h2>
<p class="mute">The blueprint says to add cardio when weight stalls, but the PDF did not include a cardio schedule. This is general guidance.</p>
<p class="mute">Do not add cardio at the start. If your weekly average weight has stalled for 7+ days while you follow the plan, either cut 100-200 calories per day or add cardio. To add cardio, start with 2 sessions a week of 20-30 minutes at an easy pace (brisk incline walk or bike). Add a session or 10 minutes every 1-2 weeks if needed. Keep it easy enough that it does not hurt your lifting.</p>
</div>
<div class="card"><h2>Track Other Metrics</h2>
<div class="scroll"><table><tr><th>Metric</th><th>How to track</th></tr>
<tr><td>Bodyweight</td><td>Weigh daily, fasted, first thing in the morning, and track the weekly average</td></tr>
<tr><td>Photos</td><td>Weekly or bi-weekly pictures, same lighting</td></tr>
<tr><td>Strength</td><td>Log your training so you can see trends</td></tr>
<tr><td>Energy, recovery, sleep</td><td>Note in your daily check-in if declining or improving</td></tr></table></div>
<div class="tip">Your physique is the reflection of how consistently you log and improve.</div>
</div>`;
}

function calcHtml(wt){
let calc='';
if(wt>0){
const m1=Math.round(wt*14),m2=Math.round(wt*16);
calc=`<h3>Your estimates</h3>
<div class="stats">
<div class="stat"><b>${m1}-${m2}</b><span>Maintenance kcal</span></div>
<div class="stat"><b>${Math.round(m1*.8)}-${Math.round(m2*.85)}</b><span>Starting kcal (15-20% deficit)</span></div>
<div class="stat"><b>${Math.round(wt)}-${Math.round(wt*1.2)} g</b><span>Protein</span></div>
<div class="stat"><b>${Math.round(wt*.3)}-${Math.round(wt*.4)} g</b><span>Fat</span></div>
</div>
<p class="mute">The Meals tab uses the fixed blueprint targets (2200, 2000, 1850, 1700 kcal). Use the numbers above as a sanity check for your size.</p>`;
}
return calc;
}
function viewSetup(){
const s=S.settings;
return`
<div class="card"><h2>Setup</h2>
<div class="row">
<div class="grow"><label>Start date (Week 1, Day 1)</label><input type="date" id="sd" value="${s.start}"></div>
<div class="grow"><label>Starting weight (lb)</label><input type="number" id="sw" inputmode="decimal" step="0.1" value="${esc(s.weight)}"></div></div>
<div class="row" style="margin-top:10px">
<div class="grow"><label>Training days per week</label><select id="sp">${[3,4,5].map(n=>`<option value="${n}" ${n===s.split?'selected':''}>${n} days</option>`).join('')}</select></div>
<div class="grow"><label>Meals per day</label><select id="sm">${[3,4,5].map(n=>`<option value="${n}" ${n===s.meals?'selected':''}>${n} meals</option>`).join('')}</select></div>
<div class="grow"><label>Food units</label><select id="su"><option value="g" ${s.units==='g'?'selected':''}>Grams</option><option value="oz" ${s.units==='oz'?'selected':''}>Ounces</option></select></div></div>
<p class="mute">Not sure? Start with 3 training days and 3 meals per day. You can change these any time.</p>
<div id="calc">${calcHtml(parseFloat(s.weight))}</div>
<div style="margin-top:14px"><button class="btn" id="sv">Save and start</button></div>
</div>
<div class="card"><h2>How it works</h2>
<p class="mute">16 weeks in four phases of 4 weeks. Each phase lowers calories and carbs while protein stays at 180 g. Your data never leaves this browser.</p>
<ol class="steps">
<li>Fill in the Setup above and tap Save and start.</li>
<li>Open Meals, pick your meals per day, and use the Weekly Shopping List to shop.</li>
<li>Each morning, weigh yourself after using the bathroom and before eating or drinking, then enter it on Today.</li>
<li>Eat the meals in your plan and log your food on Today. The bars show how close you are to your targets.</li>
<li>On training days, open Training, do the workout and log your lifts. Then tick Workout completed on Today.</li>
<li>Walk 10,000 steps a day and aim for 7-9 hours of sleep.</li>
<li>Check Progress each week. Every 4 weeks, review your weight trend and move to the next phase.</li>
<li>Export a backup now and then (Progress tab), because your data is saved only in this browser.</li>
</ol>
</div>`;
}
function bindSetup(){
$('#sw').oninput=e=>{S.settings.weight=e.target.value;$('#calc').innerHTML=calcHtml(parseFloat(e.target.value));save()};
$('#sv').onclick=()=>{
S.settings.start=$('#sd').value||TODAY;
S.settings.weight=$('#sw').value;
S.settings.split=+$('#sp').value;
S.settings.meals=+$('#sm').value;
S.settings.units=$('#su').value;
S.settings.setup=true;
const w=parseFloat(S.settings.weight);
if(w>0&&!day(TODAY).weight)day(TODAY).weight=String(w);
save();tab='today';cur=TODAY;render();
};
}

const VIEWS={today:[viewToday,bindToday],meals:[viewMeals,bindMeals],train:[viewTrain,bindTrain],progress:[viewProgress,bindProgress],guide:[viewGuide,()=>{}],setup:[viewSetup,bindSetup]};
function render(){
renderNav();
const v=VIEWS[tab];
$('#view').innerHTML=v[0]();
v[1]();
}
window.addEventListener('resize',()=>{if(tab==='progress')drawChart()});
render();
</script>
