<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six Pack Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0e0e0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Six Pack">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#0e0e0e;--card:#181818;--line:#2a2a2a;--text:#f2f2f2;--mute:#9a9a9a;--accent:#f4b928;--good:#4cc16f;--bad:#e5534b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 16px 6px;max-width:900px;margin:0 auto}
h1{margin:0;font-size:20px;letter-spacing:.5px}
h1 span{color:var(--accent)}
nav{position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
nav div{max-width:900px;margin:0 auto;display:flex;overflow-x:auto}
nav button{flex:1;min-width:84px;background:none;border:0;color:var(--mute);padding:12px 8px;font-size:15px;font-weight:600;border-bottom:3px solid transparent;cursor:pointer}
nav button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{max-width:900px;margin:0 auto;padding:14px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:17px;color:var(--accent)}
.card h2.ch{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none;-webkit-user-select:none}
.card.collapsed h2.ch{margin-bottom:0}
.chev{font-size:13px;color:var(--mute);width:14px}
.csum{margin-left:auto;font-size:13px;font-weight:500;color:var(--mute);text-align:right}
.card h3{margin:14px 0 6px;font-size:15px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:120px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:3px}
input,select,textarea{width:100%;background:#0f0f0f;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);padding:0}
textarea{min-height:70px;resize:vertical}
button.btn{background:var(--accent);color:#111;border:0;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:15px}
button.btn.alt{background:#2a2a2a;color:var(--text)}
button.btn.danger{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px}
.bar{height:12px;background:#262626;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.bar i.over{background:var(--bad)}
.bar.big{height:18px;border-radius:9px}
.goal{margin:0 0 14px}
.goal .t{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;font-size:.95rem}
.goal p{margin:8px 0 0;font-weight:600}
.goal.over p{color:var(--bad)}
.mac{margin-bottom:10px}
.mac .t{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.mac .t b{color:var(--text)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--accent);color:#111;text-align:left;padding:8px}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.check{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.pill{display:inline-block;background:#262626;border-radius:20px;padding:3px 10px;font-size:13px;color:var(--mute);margin-right:6px}
.pill.y{background:var(--accent);color:#111;font-weight:700}
.mute{color:var(--mute);font-size:14px}
.tip{border-left:4px solid var(--accent);padding:8px 12px;background:#1f1b0e;border-radius:6px;margin:10px 0;font-size:14px}
.food{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.food:last-child{border-bottom:0}
#savedtoast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--good);color:#000;padding:8px 18px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#savedtoast.show{opacity:1}
@media print{.cbody{display:block!important}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:#0f0f0f;border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--mute)}
canvas{width:100%;height:240px;display:block}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.seg button{flex:1;min-width:70px;background:#262626;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);color:#111;border-color:var(--accent)}
.vid{display:inline-block;background:#e5534b;color:#fff;text-decoration:none;font-size:10px;line-height:1;padding:4px 7px;border-radius:5px;vertical-align:middle;margin-left:4px}
.vid:hover{background:#ff6b62}
.shops{display:inline-flex;gap:6px;margin-left:6px;vertical-align:middle;flex-wrap:wrap}
.shop{text-decoration:none;font-size:12px;font-weight:700;padding:3px 8px;border-radius:12px;border:1px solid var(--line);white-space:nowrap}
.shop.g{color:#7aa7ff;border-color:#7aa7ff55}
.shop.a{color:#ffb347;border-color:#ffb34755}
.shop:hover{filter:brightness(1.3)}
.sl label{color:var(--text);font-size:15px;margin:0;flex:1;cursor:pointer}
.sl input:checked+label{text-decoration:line-through;color:var(--mute)}
.sl input:checked+label b{color:var(--mute)}
details{margin:10px 0}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
details[open] summary{margin-bottom:8px}
ol.steps{padding-left:20px;margin:0}
ol.steps li{margin-bottom:8px;font-size:14px;color:var(--mute)}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mhd{text-align:center;font-size:11px;color:var(--mute)}
.mc{min-height:62px;background:#0f0f0f;border:1px solid var(--line);border-radius:8px;padding:4px;font-size:11px;cursor:pointer;overflow:hidden}
.mc.empty{background:none;border:0;cursor:default}
.mc.today,.calday.today{border-color:var(--accent)}
.mc b{font-size:13px}
.mk{color:var(--mute)}
.mw{color:var(--accent);line-height:1.2}
.calday{cursor:pointer}
.printonly{display:none}
@media print{
body{background:#fff;color:#000}
nav,header,footer,.noprint{display:none!important}
main{padding:0;max-width:none}
.card{background:#fff;border:1px solid #888;color:#000;break-inside:avoid}
.card h2,.card h3,.mute,label,td,th,.pill,.mw,.mk,.mhd,.mc b{color:#000!important}
th{background:#ddd!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pill,.pill.y{background:#eee;border:1px solid #888}
.mc,.calday{background:#fff;border:1px solid #888}
.printonly{display:block;color:#000;font-size:18px;margin:0 0 10px}
}
.last{font-size:12px;color:var(--mute);margin-top:3px}
footer{max-width:900px;margin:0 auto;padding:0 16px 40px;color:var(--mute);font-size:12px}
</style>
</head>

else if(pct<90)msg='Keep going: about '+left+' kcal left'+(pl>0?' and '+pl+'g protein to hit.':'.');
else if(pct<=105)msg='You are at your goal. Stop eating for the day'+(pl>0?', or finish with about '+pl+'g of lean protein.':'.');
else{cls='over';msg='Over goal by about '+Math.abs(left)+' kcal. Stop eating for the day.'}

}

}

function drawChart(){
const cv=$('#cv');if(!cv)return;
const arr=weights();if(!arr.length)return;
const avg=movAvg(arr);
const dpr=window.devicePixelRatio||1;
const W=cv.clientWidth,H=cv.clientHeight;
cv.width=W*dpr;cv.height=H*dpr;
const g=cv.getContext('2d');g.scale(dpr,dpr);
const vals=arr.map(x=>x.w).concat(avg);
let lo=Math.min(...vals)-1,hi=Math.max(...vals)+1;
const L=40,R=10,T=10,B=24;
const t0=pd(arr[0].d).getTime(),t1=pd(arr[arr.length-1].d).getTime();
const X=d=>arr.length===1||t1===t0?L+(W-L-R)/2:L+(pd(d).getTime()-t0)/(t1-t0)*(W-L-R);
const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
g.strokeStyle='#2a2a2a';g.fillStyle='#9a9a9a';g.font='11px system-ui';g.lineWidth=1;
for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);g.beginPath();g.moveTo(L,y);g.lineTo(W-R,y);g.stroke();g.fillText(v.toFixed(0),4,y+4)}
g.fillText(arr[0].d.slice(5),L,H-6);
const e=arr[arr.length-1].d.slice(5);g.fillText(e,W-R-g.measureText(e).width,H-6);
g.fillStyle='#6b6b6b';arr.forEach(x=>{g.beginPath();g.arc(X(x.d),Y(x.w),3,0,7);g.fill()});
g.strokeStyle='#f4b928';g.lineWidth=2.5;g.beginPath();
arr.forEach((x,i)=>{const px=X(x.d),py=Y(avg[i]);i?g.lineTo(px,py):g.moveTo(px,py)});g.stroke();
}

<div class="row">
<div class="grow"><label>Start date (Week 1, Day 1)</label><input type="date" id="sd" value="${s.start}"></div>
<div class="grow"><label>Starting weight (lb)</label><input type="number" id="sw" inputmode="decimal" step="0.1" value="${esc(s.weight)}"></div></div>
<div class="row" style="margin-top:10px">
<div class="grow"><label>Sex (for estimates)</label><select id="sx"><option value="">Not set</option><option value="m" ${s.sex==='m'?'selected':''}>Male</option><option value="f" ${s.sex==='f'?'selected':''}>Female</option></select></div>
<div class="grow"><label>Age (optional)</label><input type="number" id="ag" inputmode="numeric" min="14" max="100" value="${esc(s.age||'')}"></div></div>
<div class="row" style="margin-top:10px">
<div class="grow"><label>Training days per week</label><select id="sp">${[3,4,5].map(n=>`<option value="${n}" ${n===s.split?'selected':''}>${n} days</option>`).join('')}</select></div>
<div class="grow"><label>Meals per day</label><select id="sm">${[3,4,5].map(n=>`<option value="${n}" ${n===s.meals?'selected':''}>${n} meals</option>`).join('')}</select></div>
<div class="grow"><label>Food units</label><select id="su"><option value="g" ${s.units==='g'?'selected':''}>Grams</option><option value="oz" ${s.units==='oz'?'selected':''}>Ounces</option></select></div></div>
<div style="margin-top:10px"><label>Training days (tap to change)</label><div class="seg" id="tdw" style="margin-bottom:4px">${WD.map((n,i)=>`<button data-wd="${i}" class="${window._td.includes(i)?'on':''}">${n}</button>`).join('')}</div><p class="mute" id="tdnote" style="margin:0"></p></div>
<p class="mute">Not sure? Start with 3 training days and 3 meals per day. You can change these any time.</p>
<div id="calc">${calcHtml(parseFloat(s.weight),s.sex,s.age)}</div>
<div style="margin-top:14px"><button class="btn" id="sv">Save and start</button></div>
</div>
<div class="card"><h2>Where do you train?</h2>
<div class="seg" id="gymsel"><button data-g="full" class="${s.gym==='home'?'':'on'}">Full gym</button><button data-g="home" class="${s.gym==='home'?'on':''}">Home gym</button></div>
<div id="eqbox" style="display:${s.gym==='home'?'block':'none'}">
<p class="mute" style="margin:0 0 8px">Check everything you own. Workouts are swapped to use only what you have. Bodyweight options fill any gaps.</p>
${EQUIP.map(e=>`<div class="check"><input type="checkbox" id="eq_${e[0]}" data-eq="${e[0]}" ${(s.equip||[]).includes(e[0])?'checked':''}><label for="eq_${e[0]}" style="margin:0;color:var(--text)">${e[1]}</label></div>`).join('')}
</div>
<p class="mute" id="gymnote" style="margin:8px 0 0">${s.gym==='home'?'':'Full gym uses the original workouts from the plan.'}</p>
</div>
<div class="card"><h2>How it works</h2>
<p class="mute">16 weeks in four phases of 4 weeks. Each phase lowers calories and carbs while protein stays at 180 g. Your data never leaves this browser.</p>
<ol class="steps">
<li>Fill in the Setup above and tap Save and start.</li>
<li>Open Meals, pick your meals per day, and use the Weekly Shopping List to shop.</li>
<li>Each morning, weigh yourself after using the bathroom and before eating or drinking, then enter it on Today.</li>
<li>Eat the meals in your plan and log your food on Today. The bars show how close you are to your targets.</li>
<li>On training days, open Training, do the workout and log your lifts. Then tick Workout completed on Today.</li>
<li>Walk 10,000 steps a day and aim for 7-9 hours of sleep.</li>
<li>Check Progress each week. Every 4 weeks, review your weight trend and move to the next phase.</li>
<li>Export a backup now and then (Progress tab), because your data is saved only in this browser.</li>
</ol>
</div>`;
}
function bindSetup(){
const paint=()=>{
document.querySelectorAll('#tdw button').forEach(b=>b.classList.toggle('on',window._td.includes(+b.dataset.wd)));
const n=window._td.length,m=SPLITS[+$('#sp').value].length;
$('#tdnote').textContent=n===m?'':'You picked '+n+' days but this plan has '+m+' workouts. They will rotate in order.';
};
document.querySelectorAll('#tdw button').forEach(b=>b.onclick=()=>{const i=+b.dataset.wd;window._td=window._td.includes(i)?window._td.filter(x=>x!==i):window._td.concat(i).sort();paint()});
$('#sp').onchange=()=>{window._td=DEF_TD[+$('#sp').value].slice();paint()};
paint();
document.querySelectorAll('#gymsel button').forEach(b=>b.onclick=()=>{
S.settings.gym=b.dataset.g;save();
document.querySelectorAll('#gymsel button').forEach(x=>x.classList.toggle('on',x===b));
$('#eqbox').style.display=S.settings.gym==='home'?'block':'none';
$('#gymnote').textContent=S.settings.gym==='home'?'':'Full gym uses the original workouts from the plan.';
});
document.querySelectorAll('[data-eq]').forEach(c=>c.onchange=()=>{
const set=new Set(S.settings.equip||[]);
if(c.checked)set.add(c.dataset.eq);else set.delete(c.dataset.eq);
S.settings.equip=[...set];save();
});
const refCalc=()=>{
S.settings.weight=$('#sw').value;S.settings.sex=$('#sx').value;S.settings.age=$('#ag').value;
$('#calc').innerHTML=calcHtml(parseFloat($('#sw').value),$('#sx').value,$('#ag').value);save(true);
};
$('#sw').oninput=refCalc;$('#sx').onchange=refCalc;$('#ag').oninput=refCalc;
$('#sv').onclick=()=>{
S.settings.start=$('#sd').value||TODAY;
S.settings.weight=$('#sw').value;
S.settings.sex=$('#sx').value;
S.settings.age=$('#ag').value;
S.settings.split=+$('#sp').value;
S.settings.meals=+$('#sm').value;
S.settings.units=$('#su').value;
S.settings.trainDays=window._td.slice().sort();
S.settings.setup=true;
const w=parseFloat(S.settings.weight);
if(w>0&&!day(TODAY).weight)day(TODAY).weight=String(w);
save();tab='today';cur=TODAY;render();
};
}

function calStep(dir){
if(calView==='day')return addDays(calDate,dir);
if(calView==='week')return addDays(calDate,7*dir);
const dt=pd(calDate);
return ds(new Date(dt.getFullYear(),dt.getMonth()+dir,1));
}
function calLabel(){
if(calView==='day')return fmtDate(calDate);
if(calView==='week'){
const s=addDays(calDate,-pd(calDate).getDay());
return pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' to '+pd(addDays(s,6)).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
}
if(calView==='month')return pd(calDate).toLocaleDateString(undefined,{month:'long',year:'numeric'});
return '16 Week Plan, '+fmtDate(S.settings.start)+' to '+fmtDate(addDays(S.settings.start,111));
}
function calDay(d){
const ph=phaseFor(d),wo=workoutOn(d),x=S.days[d]||{supps:{}},st=dayStatus(d),rows=ph.plans[S.settings.meals].rows;
return`<div class="card"><h2>${fmtDate(d)}${d===TODAY?' (Today)':''}</h2>
<p style="margin:0"><span class="pill y">${weekLabel(d)}</span><span class="pill">${ph.label} targets</span></p>
<h3>Workout</h3>
${wo?`<p style="margin:0 0 6px"><b>${esc(wo.name)}</b></p><div class="scroll"><table><tr><th>Exercise</th><th>Sets</th><th>Reps</th></tr>${wo.list.map(n=>`<tr><td>${n}</td><td>${EX[n][0]}</td><td>${EX[n][1]}</td></tr>`).join('')}</table></div><div class="check"><input type="checkbox" data-cw="${d}" ${x.workout?'checked':''}><label style="margin:0;color:var(--text)">Workout completed</label></div>`:'<p class="mute" style="margin:0">Rest day. Walk, stretch and recover.</p>'}
<h3>Food: ${ph.kcal} kcal | ${ph.p}g protein | ${ph.c}g carbs | ${ph.f}g fat</h3>
<div class="scroll"><table><tr><th>Meal</th><th>Foods</th><th>Quantity</th></tr>${rows.map((m,i)=>`<tr><td><b>${i+1}</b></td><td>${m[0]}</td><td>${conv(m[1])}</td></tr>`).join('')}</table></div>
<h3>Daily habits</h3>
<p class="mute" style="margin:0">Weigh in fasted in the morning. 10,000 steps. 7-9 hours of sleep.</p>
<h3>Supplements</h3>
${SUPPS.map((s,i)=>`<div class="check"><input type="checkbox" data-cs="${i}" data-d="${d}" ${(x.supps||{})[i]?'checked':''}><label style="margin:0;color:var(--text)">${s[0]} <span class="mute">${s[1]}</span></label></div>`).join('')}
<h3>Logged so far</h3>
<p class="mute" style="margin:0">Weight: ${st.weight?esc(st.weight)+' lb':'not logged'} | Food: ${st.kcal} of ${ph.kcal} kcal | Steps: ${st.steps?esc(st.steps):'not logged'}</p>
<div class="noprint" style="margin-top:12px"><button class="btn" data-log="${d}">Open in Today to log</button></div>
</div>`;
}
function calWeek(d){
const s=addDays(d,-pd(d).getDay());
let o='';
for(let i=0;i<7;i++){
const x=addDays(s,i),wo=workoutOn(x),st=dayStatus(x),ph=phaseFor(x),dt=pd(x);
o+=`<div class="card calday${x===TODAY?' today':''}" data-go="${x}"><div class="row" style="justify-content:space-between"><b>${WD[i]} ${dt.getMonth()+1}/${dt.getDate()}</b><span class="mute">${weekLabel(x)}</span></div>
<div style="margin-top:4px">Workout: <b>${wo?esc(shortName(wo.name)):'Rest day'}</b>${st.workout?' &#10003;':''}</div>
<div class="mute">Food: ${ph.kcal} kcal | ${ph.p}g protein | Steps: 10,000 | Sleep: 7-9 h</div>
<div class="mute">Logged: weight ${st.weight?esc(st.weight):'-'} | food ${st.kcal} kcal | supplements ${st.supps}/${SUPPS.length}</div></div>`;
}
return o;
}
function calMonth(d){
const dt=pd(d),y=dt.getFullYear(),m=dt.getMonth();
const first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate();
let o='<div class="card"><div class="mgrid">'+WD.map(w=>`<div class="mhd">${w}</div>`).join('');
for(let i=0;i<first;i++)o+='<div class="mc empty"></div>';
for(let k=1;k<=n;k++){
const cd=new Date(y,m,k),x=ds(cd),wo=workoutOn(x),st=dayStatus(x),w=weekNum(x);
o+=`<div class="mc${x===TODAY?' today':''}" data-go="${x}"><b>${k}</b>${w>=1&&w<=16&&cd.getDay()===0?`<span class="mk"> W${w}</span>`:''}<div class="mw">${wo?esc(shortName(wo.name)):''}${st.workout?' &#10003;':''}</div></div>`;
}
return o+'</div><p class="mute" style="margin:10px 0 0">Tap a day to open it. W = plan week. A check mark means the workout is done.</p></div>';
}
function calPlan(){
let o='<div class="card scroll"><table><tr><th>Week</th><th>Dates</th><th>Targets</th><th>Training</th></tr>';
for(let w=1;w<=16;w++){
const s=addDays(S.settings.start,(w-1)*7),ph=PHASES[Math.floor((w-1)/4)];
const t=[];
for(let i=0;i<7;i++){const x=addDays(s,i),wo=workoutOn(x);if(wo)t.push(WD[pd(x).getDay()]+' '+esc(shortName(wo.name)))}
const a=pd(s),b=pd(addDays(s,6));
o+=`<tr><td><b>${w}</b></td><td>${a.getMonth()+1}/${a.getDate()} to ${b.getMonth()+1}/${b.getDate()}</td><td>${ph.kcal} kcal<br><span class="mute">P ${ph.p} | C ${ph.c} | F ${ph.f}</span></td><td>${t.join(', ')}</td></tr>`;
}
return o+'</table></div><div class="card"><p class="mute" style="margin:0">Every day: weigh in fasted, 10,000 steps, 7-9 hours of sleep. Every 4 weeks: review your weight trend and move to the next phase targets.</p></div>';
}
function viewCal(){
const body=calView==='day'?calDay(calDate):calView==='week'?calWeek(calDate):calView==='month'?calMonth(calDate):calPlan();
return`<div class="card noprint"><div class="seg" style="margin-bottom:10px">${[['day','Day'],['week','Week'],['month','Month'],['plan','16 Weeks']].map(v=>`<button data-cv="${v[0]}" class="${calView===v[0]?'on':''}">${v[1]}</button>`).join('')}</div>
${calView==='plan'?'':`<div class="row"><button class="btn alt sm" id="cprev">&lt;</button><b class="grow" style="text-align:center">${calLabel()}</b><button class="btn alt sm" id="cnext">&gt;</button><button class="btn sm" id="ctod">Today</button></div>`}
<div style="margin-top:10px"><button class="btn alt" id="cprint">Print this calendar</button></div></div>
<h2 class="printonly">Six Pack Tracker: ${calLabel()}</h2>
${body}`;
}
function bindCal(){
document.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{calView=b.dataset.cv;render()});
const p=$('#cprev'),n=$('#cnext'),t=$('#ctod');
if(p)p.onclick=()=>{calDate=calStep(-1);render()};
if(n)n.onclick=()=>{calDate=calStep(1);render()};
if(t)t.onclick=()=>{calDate=TODAY;render()};
$('#cprint').onclick=()=>window.print();
document.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>{calDate=e.dataset.go;calView='day';render();window.scrollTo(0,0)});
document.querySelectorAll('[data-cw]').forEach(c=>c.onchange=()=>{day(c.dataset.cw).workout=c.checked;save()});
document.querySelectorAll('[data-cs]').forEach(c=>c.onchange=()=>{day(c.dataset.d).supps[c.dataset.cs]=c.checked;save()});
document.querySelectorAll('[data-log]').forEach(b=>b.onclick=()=>{cur=b.dataset.log;tab='today';render();window.scrollTo(0,0)});
}

const VIEWS={today:[viewToday,bindToday],cal:[viewCal,bindCal],meals:[viewMeals,bindMeals],train:[viewTrain,bindTrain],progress:[viewProgress,bindProgress],guide:[viewGuide,()=>{}],setup:[viewSetup,bindSetup]};
function setSum(key,text){
try{
const hd=document.querySelector('#view h2[data-key="'+key+'"]');
if(!hd)return;
hd.setAttribute('data-sum',text);
if(hd.parentElement.classList.contains('collapsed'))hd.querySelector('.csum').textContent=text;
}catch(x){}
}
function morningSum(){
const d=day(cur),s=parseFloat(d.sleep);
let H=isNaN(s)?'':Math.floor(s),M=isNaN(s)?'':Math.round((s-Math.floor(s))*60);
if(M===60){M=0;H=H+1}
setSum('today:Morning',(d.weight!==''?d.weight+' lb':'no weight')+(isNaN(s)?'':', '+H+'h '+M+'m'));
}
function applyCollapse(){
try{
if(S.collapsedDate!==TODAY){Object.keys(S.collapsed||{}).forEach(k=>{if(k.indexOf('today:')===0)delete S.collapsed[k]});S.collapsedDate=TODAY}
S.collapsed=S.collapsed||{};
document.querySelectorAll('#view .card').forEach(card=>{
const hd=card.firstElementChild;
if(!hd||hd.tagName!=='H2')return;
const key=tab+':'+hd.textContent.trim();
const body=document.createElement('div');
body.className='cbody';
while(hd.nextSibling)body.appendChild(hd.nextSibling);
card.appendChild(body);
const chev=document.createElement('span');chev.className='chev';
const sum=document.createElement('span');sum.className='csum';
const label=document.createElement('span');label.textContent=hd.textContent;
hd.textContent='';hd.appendChild(chev);hd.appendChild(label);hd.appendChild(sum);
hd.classList.add('ch');hd.dataset.key=key;hd.setAttribute('role','button');hd.tabIndex=0;
const set=c=>{
body.style.display=c?'none':'';
card.classList.toggle('collapsed',c);
sum.textContent=c?(hd.getAttribute('data-sum')||''):'';
chev.textContent=c?'\u25B8':'\u25BE';
hd.setAttribute('aria-expanded',c?'false':'true');
};
set(!!S.collapsed[key]);
const toggle=()=>{
const c=!S.collapsed[key];
if(c)S.collapsed[key]=true;else delete S.collapsed[key];
save(true);set(c);
if(!c&&tab==='progress')drawChart();
};
hd.onclick=toggle;
hd.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}};
});
}catch(x){}
}
function render(){
renderNav();
const v=VIEWS[tab];
$('#view').innerHTML=v[0]();
v[1]();
applyCollapse();
}
if(typeof navigator!=='undefined'&&navigator.serviceWorker&&typeof location!=='undefined'&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('resize',()=>{if(tab==='progress')drawChart()});
render();
</script>
</body>
</html>
